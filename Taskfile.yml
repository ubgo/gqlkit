# https://taskfile.dev

version: "3"

vars:
  # Heavy test runs take a machine-wide lock when the maintainer's `testlock`
  # helper is on PATH, so parallel sessions don't overload the CPU. Anywhere
  # else this is empty and the internal task runs directly, so contributors
  # without testlock never see "command not found".
  TESTLOCK:
    sh: command -v testlock >/dev/null 2>&1 && echo testlock || true

tasks:
  # gqlkit-sdl tasks (schema introspection fetcher)
  gqlkit-sdl:run:
    desc: Run gqlkit-sdl module
    dir: ./gqlkit-sdl
    cmds:
      - go run .

  gqlkit-sdl:build:
    desc: Build gqlkit-sdl module
    dir: ./gqlkit-sdl
    cmds:
      - go build -o ../bin/gqlkit-sdl .

  # mockapi tasks (gqlgen-based test GraphQL API)
  mockapi:run:
    desc: Run mockapi GraphQL server
    dir: ./mockapi
    cmds:
      - go run ./server.go

  mockapi:build:
    desc: Build mockapi server binary
    dir: ./mockapi
    cmds:
      - go build -o ../bin/mockapi ./server.go

  mockapi:generate:
    # gqlgen v0.17.87 cannot load packages under newer toolchains (x/tools
    # reports "package ... without types"), so pin the toolchain it runs on.
    desc: Regenerate gqlgen code for mockapi (GOWORK=off, pinned to Go 1.25.5)
    dir: ./mockapi
    cmds:
      - GOTOOLCHAIN=go1.25.5 GOWORK=off go run github.com/99designs/gqlgen@v0.17.87 generate

  # gqlkit-ts tasks (TypeScript runtime library)
  gqlkit-ts:install:
    desc: Install gqlkit-ts npm dependencies
    dir: ./gqlkit-ts
    cmds:
      - npm install

  gqlkit-ts:build:
    desc: Build gqlkit-ts TypeScript runtime library
    dir: ./gqlkit-ts
    cmds:
      - npm run build

  gqlkit-ts:setup:
    desc: Install and build gqlkit-ts
    cmds:
      - task: gqlkit-ts:install
      - task: gqlkit-ts:build

  # example-go-mockapi tasks (Go SDK from test API)
  example-go-mockapi:fetch-schema:
    desc: Fetch schema from mockapi via gqlkit-sdl
    dir: .
    cmds:
      - go run ./gqlkit-sdl fetch --url http://localhost:8081/query --output example-go-mockapi/cmd/generate/schema.graphql

  example-go-mockapi:generate:
    desc: Generate Go SDK for mockapi schema
    dir: ./example-go-mockapi
    cmds:
      - go run ./cmd/generate

  # -count=1 is deliberate: these tests talk to a live mockapi, which Go's
  # test cache cannot see. They fail (never skip) when mockapi is down;
  # MOCKAPI_URL overrides the address.
  example-go-mockapi:test:
    desc: Run the Go guide programs' tests against mockapi (requires mockapi running)
    cmds:
      - "{{.TESTLOCK}} task example-go-mockapi:test:run"

  # No desc (hidden from `task --list`) and not `internal: true`: testlock
  # re-invokes it as a CLI command, which Task refuses for internal tasks.
  example-go-mockapi:test:run:
    dir: ./example-go-mockapi
    cmds:
      - go test -count=1 ./...

  example-go-mockapi:run:
    desc: Run Go sample queries against mockapi
    dir: ./example-go-mockapi
    cmds:
      - go run ./cmd/samples

  # example-ts tasks (TypeScript SDK generator)
  example-ts:install:
    desc: Install example-ts npm dependencies
    dir: ./example-ts
    cmds:
      - npm install

  example-ts:fetch-schema:
    desc: Fetch schema from mockapi via gqlkit-sdl into example-ts
    dir: .
    cmds:
      - go run ./gqlkit-sdl fetch --url http://localhost:8081/query --output example-ts/cmd/generate/schema.graphql

  example-ts:generate:
    desc: Generate TypeScript SDK from schema
    dir: ./example-ts
    cmds:
      - go run ./cmd/generate

  example-ts:generate:clean:
    desc: Clean and regenerate TypeScript SDK
    dir: ./example-ts
    cmds:
      - rm -rf sdk
      - go run ./cmd/generate

  example-ts:typecheck:
    desc: TypeScript type-check the generated SDK and samples
    dir: ./example-ts
    cmds:
      - npx tsc --noEmit

  example-ts:build:
    desc: Build the Go TS generator binary
    dir: ./example-ts
    cmds:
      - go build ./cmd/generate/

  example-ts:run:
    desc: Run TypeScript sample queries (requires mockapi running)
    dir: ./example-ts
    cmds:
      - npm run samples

  example-ts:samples:
    desc: Run every TypeScript guide sample against mockapi (fails on any error)
    dir: ./example-ts
    cmds:
      - npx tsx cmd/samples/run-all.ts

  example-ts:test:
    desc: Full test — build generator, clean generate SDK, type-check
    dir: ./example-ts
    cmds:
      - go build ./cmd/generate/
      - go vet ./cmd/generate/
      - rm -rf sdk
      - go run ./cmd/generate
      - npx tsc --noEmit
      - echo "All checks passed."

  example-ts:setup:
    desc: First-time setup — build runtime, install deps, generate, type-check
    cmds:
      - task: gqlkit-ts:setup
      - task: example-ts:install
      - task: example-ts:generate
      - task: example-ts:typecheck

  # Workspace tasks
  example-cli:install:
    desc: Install npm packages for the example-cli TypeScript check (needs gqlkit-ts:setup once)
    dir: ./example-cli
    cmds:
      - npm install

  example-cli:test:
    desc: Run every example-cli script against mockapi and check the outputs (requires mockapi running)
    cmds:
      - ./example-cli/test.sh

  # Fails fast with a clear message when mockapi is not answering, so the
  # live example suites below never report a wall of "connection refused".
  # -count=1 is deliberate: the test talks to a live mockapi.
  example-cli:programmatic:test:
    desc: Run the programmatic generator examples (sdlapi then gen) against mockapi (requires mockapi running)
    dir: ./example-cli/programmatic
    cmds:
      - go test -count=1 ./...

  mockapi:require:
    desc: Fail unless mockapi answers at http://localhost:8081/query
    cmds:
      - |
        curl -sf -o /dev/null -X POST -H 'content-type: application/json' --data '{"query":"{__typename}"}' http://localhost:8081/query \
          || { echo "mockapi is not running at http://localhost:8081/query; start it with: task mockapi:run" >&2; exit 1; }

  examples:test:
    desc: Run every live example suite (Go guide programs, TS samples, example-cli) against mockapi
    cmds:
      - "{{.TESTLOCK}} task examples:test:run"

  # Twin of examples:test that does the work (nested testlock calls inside the
  # steps pass straight through). No desc, so it is hidden from `task --list`,
  # and not `internal: true`: testlock re-invokes it as a CLI command, which
  # Task refuses for internal tasks.
  examples:test:run:
    cmds:
      - task: mockapi:require
      - task: example-go-mockapi:test
      - cd example-ts && npx tsx cmd/samples/run-all.ts
      - task: example-cli:test
      - task: example-cli:programmatic:test

  lint:
    desc: Run golangci-lint (default rules, uncapped counts) on every Go module in go.work
    cmds:
      - "{{.TESTLOCK}} task lint:run"

  # Twin of lint that does the work; hidden (no desc) and not internal, for the
  # same testlock reason as examples:test:run. Modules come from go.work's
  # `./dir` lines (POSIX classes, because Task's shell reads `\t` in a bracket
  # as a literal t and used to strip it from "example-go-chat"), so a new
  # module is linted as soon as it is added there. The two max flags turn
  # off golangci-lint's default truncation (3 same issues, 50 per linter),
  # which otherwise under-reports the real count.
  lint:run:
    cmds:
      - |
        set -e
        for d in $(sed -n 's/^[[:space:]]*\(\.\/[^[:space:]]*\)[[:space:]]*$/\1/p' go.work); do
          echo ">> gofmt $d"
          # Mirrors the CI lint workflow: golangci-lint's default rules do not
          # include gofmt, so an unformatted file passed locally and failed CI.
          unformatted="$(cd "$d" && gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "not gofmt-formatted in $d:"; echo "$unformatted"; exit 1; fi
          echo ">> golangci-lint $d"
          (cd "$d" && golangci-lint run --max-same-issues=0 --max-issues-per-linter=0 ./...)
        done

  build:
    desc: Build all modules
    cmds:
      - mkdir -p bin
      - task: gqlkit-sdl:build
      - task: mockapi:build

  tidy:
    desc: Run go mod tidy on all modules
    cmds:
      - |
        set -ex
        for d in $(sed -n 's/^[[:space:]]*\(\.\/[^[:space:]]*\)[[:space:]]*$/\1/p' go.work); do
          echo ">> Tidying '$d'"
          (cd "$d" && go mod tidy)
        done

  upgrade:
    desc: Update all go modules in go.work
    cmds:
      - |
        set -ex
        for d in $(sed -n 's/^[[:space:]]*\(\.\/[^[:space:]]*\)[[:space:]]*$/\1/p' go.work); do
          echo ">> Updating '$d'"
          (cd "$d" && go get -u ./... && go mod tidy)
        done

  # Docs + quality gates
  check:
    desc: The full local gate (CI is manual-only) — lint, Go + TS tests as CI runs them, docs check, then every example against mockapi
    cmds:
      - "{{.TESTLOCK}} task check:run"

  # Twin of check that does the work; hidden (no desc) and not internal, for
  # the same testlock reason as examples:test:run. The Go tests mirror the
  # test workflow exactly (GOWORK=off, -race), so a green `task check` means
  # a manual CI run would be green too. examples:test needs mockapi running.
  check:run:
    cmds:
      - task: lint:run
      - cd gqlkit && GOWORK=off go test ./... -race -cover
      - cd gqlkit-sdl && GOWORK=off go test ./... -race -cover
      - cd mockapi && go test ./... -race
      - cd gqlkit-ts && npm run typecheck && npm test
      - task: docs:check
      - task: examples:test:run

  docs:check:
    desc: Verify markdown — relative links resolve, anchors match GitHub slugs, no thematic breaks, no hard-wrapped prose
    cmds:
      - python3 scripts/check-docs.py

  test:cover:
    desc: Per-module coverage summary (GOWORK=off so each module resolves exactly as CI and `go install` do)
    cmds:
      - |
        set -e
        mkdir -p .coverage
        for d in gqlkit gqlkit-sdl; do
          echo ">> $d"
          (cd "$d" && GOWORK=off go test -coverprofile=../.coverage/$d.out -covermode=atomic ./... >/dev/null && GOWORK=off go tool cover -func=../.coverage/$d.out | tail -1)
        done

  test:cover:html:
    desc: Open the per-module coverage profile in a browser
    cmds:
      - task: test:cover
      - |
        set -e
        for d in gqlkit gqlkit-sdl; do
          go tool cover -html=.coverage/$d.out -o .coverage/$d.html
        done
        echo "wrote .coverage/gqlkit.html .coverage/gqlkit-sdl.html"

  test:uncovered:
    desc: List every statement with 0% coverage, worst files first — the work queue for pinning tests
    cmds:
      - task: test:cover
      - |
        set -e
        for d in gqlkit gqlkit-sdl; do
          echo ">> $d uncovered"
          go tool cover -func=.coverage/$d.out | awk '$3 == "0.0%"' || true
        done

  cover:
    desc: Coverage across every module in the workspace
    cmds:
      - task: test:cover
