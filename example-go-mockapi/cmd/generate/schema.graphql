"""
Define a Relay Cursor type:
https://relay.dev/graphql/connections.htm#sec-Cursor
"""
scalar Cursor

"ISO-8601 date-time string (e.g. \"2025-01-15T09:30:00Z\")."
scalar DateTime

"Arbitrary JSON blob — useful for dynamic/unstructured data."
scalar JSON

"Free-form key/value metadata attached to an entity."
scalar Metadata

type Mutation {
  createTodo(input: NewTodo!): Todo!
  updateTodo(id: ID!, input: UpdateTodoInput!): Todo
  deleteTodo(id: ID!): Boolean!
  upsertUser(
    id: ID
    name: String!
    email: String
    role: Role = USER
  ): User!
  completeAllTodos: Int!
}

input NewTodo {
  text: String!
  userId: ID!
  priority: Int
  tags: [String!]
}

interface Node {
  id: ID!
}

type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: Cursor
  endCursor: Cursor
}

input PaginationInput {
  limit: Int! = 10
  offset: Int! = 0
}

type Query {
  ping: String!
  todo(id: ID!): Todo
  todos(filter: TodoFilter, pagination: PaginationInput): [Todo!]!
  todosConnection(filter: TodoFilter, pagination: PaginationInput): TodoConnection!
  user(id: ID!): User
  users: [User!]!
  search(term: String!): [SearchResult!]!
  echo(message: String!): String!
  sum(a: Int!, b: Int!): Int!
  serverInfo: JSON!
  """
  Always fails: resolves to null and adds a GraphQL error carrying
  extensions.code. Batch it beside a good field to see partial data.
  Defaults: message "fail called", code "MOCK_FAILURE".
  """
  fail(message: String, code: String): String
  """
  Echoes the named HTTP request header (case-insensitive), or null when the
  request did not send it. requestHeader(name: "Authorization") shows the
  auth header a client sent.
  """
  requestHeader(name: String!): String
  """
  Relay-style lookup by typed ID "<Type>:<id>", e.g. "Todo:1" or "User:2"
  (todo and user IDs overlap, so a bare id would be ambiguous). Null when
  the type is unknown or nothing has that id.
  """
  node(id: ID!): Node
}

enum Role {
  ADMIN
  USER
  GUEST
}

union SearchResult = Todo | User

type Todo implements Node {
  id: ID!
  text: String!
  done: Boolean!
  priority: Int
  tags: [String!]!
  user: User!
  createdAt: DateTime!
  metadata: Metadata
  """
  Self-reference: the todo this one belongs under, or null for a top-level
  todo. Seed todo "2" has todo "1" as its parent.
  """
  parent: Todo
}

type TodoConnection {
  edges: [TodoEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type TodoEdge {
  cursor: Cursor!
  node: Todo!
}

input TodoFilter {
  textContains: String
  done: Boolean
  minPriority: Int
  hasTag: String
}

input UpdateTodoInput {
  text: String
  done: Boolean
  priority: Int
  tags: [String!]
}

type User implements Node {
  id: ID!
  name: String!
  email: String
  role: Role!
}

"Directs the executor to defer this fragment when the `if` argument is true or undefined."
directive @defer(
    "Deferred when true or undefined."
    if: Boolean = true
    "Unique name"
    label: String
  ) on FRAGMENT_SPREAD | INLINE_FRAGMENT

"Indicates exactly one field must be supplied and this field must not be `null`."
directive @oneOf on INPUT_OBJECT

